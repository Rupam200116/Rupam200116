<svg width="900" height="280" viewBox="0 0 900 280"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .title {
      font: 700 22px Arial, sans-serif;
      fill: #58a6ff;
    }

    .label {
      font: 600 13px Arial, sans-serif;
      fill: #c9d1d9;
    }

    .sub {
      font: 11px Arial, sans-serif;
      fill: #8b949e;
    }

    .node {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 2;
    }

    .line {
      fill: none;
      stroke: #30363d;
      stroke-width: 3;
    }

    .flow {
      fill: #58a6ff;
      filter: drop-shadow(0 0 5px #58a6ff);
    }

    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    .move1 {
      animation: move 4s linear infinite;
    }

    .move2 {
      animation: move 4s linear infinite 1s;
    }

    .move3 {
      animation: move 4s linear infinite 2s;
    }

    .move4 {
      animation: move 4s linear infinite 3s;
    }

    @keyframes move {
      0% {
        transform: translateX(0);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        transform: translateX(720px);
        opacity: 0;
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.65;
      }

      50% {
        opacity: 1;
      }
    }
  </style>

  <!-- Background -->
  <rect width="900" height="280" rx="18" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" class="title">
    DEVOPS ECOSYSTEM
  </text>

  <!-- Pipeline -->
  <path
    d="M90 130 H810"
    class="line"
  />

  <!-- Animated flow -->
  <circle cx="90" cy="130" r="5" class="flow move1"/>
  <circle cx="90" cy="130" r="5" class="flow move2"/>
  <circle cx="90" cy="130" r="5" class="flow move3"/>
  <circle cx="90" cy="130" r="5" class="flow move4"/>

  <!-- Node 1 -->
  <g class="pulse">
    <rect x="40" y="90" width="100" height="80" rx="14" class="node"/>
    <text x="90" y="120" text-anchor="middle" class="label">☁ CLOUD</text>
    <text x="90" y="142" text-anchor="middle" class="sub">AWS • Azure • GCP</text>
  </g>

  <!-- Node 2 -->
  <g class="pulse">
    <rect x="190" y="90" width="100" height="80" rx="14" class="node"/>
    <text x="240" y="120" text-anchor="middle" class="label">🏗 IaC</text>
    <text x="240" y="142" text-anchor="middle" class="sub">Terraform</text>
  </g>

  <!-- Node 3 -->
  <g class="pulse">
    <rect x="340" y="90" width="100" height="80" rx="14" class="node"/>
    <text x="390" y="120" text-anchor="middle" class="label">🚀 CI/CD</text>
    <text x="390" y="142" text-anchor="middle" class="sub">Jenkins • GitHub</text>
  </g>

  <!-- Node 4 -->
  <g class="pulse">
    <rect x="490" y="90" width="100" height="80" rx="14" class="node"/>
    <text x="540" y="120" text-anchor="middle" class="label">🐳 CONTAINERS</text>
    <text x="540" y="142" text-anchor="middle" class="sub">Docker • K8s</text>
  </g>

  <!-- Node 5 -->
  <g class="pulse">
    <rect x="640" y="90" width="100" height="80" rx="14" class="node"/>
    <text x="690" y="120" text-anchor="middle" class="label">🔐 DEVSECOPS</text>
    <text x="690" y="142" text-anchor="middle" class="sub">Scan • Secure</text>
  </g>

  <!-- Node 6 -->
  <g class="pulse">
    <rect x="790" y="90" width="80" height="80" rx="14" class="node"/>
    <text x="830" y="120" text-anchor="middle" class="label">🤖 AI</text>
    <text x="830" y="142" text-anchor="middle" class="sub">Automation</text>
  </g>

  <!-- Bottom labels -->
  <text x="450" y="215" text-anchor="middle" class="sub">
    Infrastructure → Automation → Delivery → Security → Observability → AI
  </text>

  <!-- Status -->
  <circle cx="365" cy="245" r="5" fill="#3fb950"/>
  <text x="380" y="249" class="sub">
    Pipeline operational • Infrastructure automated • Deployment ready
  </text>

</svg>
